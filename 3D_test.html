<!doctype html>
<html lang="zh-TW">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>矽晶體鑽石立方結構 3D 互動模型</title>
        <style>
            body {
                margin: 0;
                padding: 0;
                overflow: hidden;
                background-color: #1a1a1a;
                color: #fff;
                font-family: Arial, sans-serif;
            }
            #info {
                position: absolute;
                top: 10px;
                left: 10px;
                background: rgba(0, 0, 0, 0.85);
                padding: 15px;
                border-radius: 8px;
                max-width: 320px;
                box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
                pointer-events: none;
            }
            h2 {
                margin-top: 0;
                font-size: 16px;
                color: #4deeea;
            }
            .layer-info {
                font-size: 13px;
                margin: 5px 0;
                line-height: 1.4;
            }
            .dot {
                display: inline-block;
                width: 10px;
                height: 10px;
                border-radius: 50%;
                margin-right: 6px;
            }
        </style>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    </head>
    <body>
        <div id="info">
            <h2>矽晶體鑽石立方晶胞｜分層原子位置</h2>
            <p style="font-size: 12px; color: #ccc">
                <b>操作方式：</b><br />按住滑鼠左鍵拖曳：360度旋轉<br />滾輪：放大 / 縮小
            </p>
            <hr style="border: 0.5px solid #444" />
            <div class="layer-info">
                <span class="dot" style="background: #dc143c"></span><b>z = a (紅色)</b>: 5 顆 (4頂點 + 1頂面心)
            </div>
            <div class="layer-info">
                <span class="dot" style="background: #ff8c00"></span><b>z = 3/4a (橘色)</b>: 2 顆 (內部四面體)
            </div>
            <div class="layer-info">
                <span class="dot" style="background: #32cd32"></span><b>z = 1/2a (綠色)</b>: 4 顆 (4側面中心)
            </div>
            <div class="layer-info">
                <span class="dot" style="background: #1e90ff"></span><b>z = 1/4a (藍色)</b>: 2 顆 (內部四面體)
            </div>
            <div class="layer-info">
                <span class="dot" style="background: #8a2be2"></span><b>z = 0 (紫色)</b>: 5 顆 (4頂點 + 1底面心)
            </div>
            <p style="font-size: 12px; font-weight: bold; color: #e71d36; margin-top: 8px">
                圖中共標示 18 個矽原子位置
            </p>
        </div>

        <script>
            const scene = new THREE.Scene();
            scene.background = new THREE.Color(0x18181c);

            const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(2.5, 2.0, 3.0);

            const renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            document.body.appendChild(renderer.domElement);

            const controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
            controls.target.set(0.5, 0.5, 0.5);

            const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
            scene.add(ambientLight);

            const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
            dirLight.position.set(5, 10, 7);
            scene.add(dirLight);

            // 正確 18 顆矽原子座標
            const atomsData = [
                { pos: [0, 0, 0], col: 0x8a2be2 },
                { pos: [1, 0, 0], col: 0x8a2be2 },
                { pos: [0, 1, 0], col: 0x8a2be2 },
                { pos: [1, 1, 0], col: 0x8a2be2 },
                { pos: [0.5, 0.5, 0], col: 0x8a2be2 },

                { pos: [0.25, 0.25, 0.25], col: 0x1e90ff },
                { pos: [0.75, 0.75, 0.25], col: 0x1e90ff },

                { pos: [0.5, 0, 0.5], col: 0x32cd32 },
                { pos: [0.5, 1, 0.5], col: 0x32cd32 },
                { pos: [0, 0.5, 0.5], col: 0x32cd32 },
                { pos: [1, 0.5, 0.5], col: 0x32cd32 },

                { pos: [0.25, 0.75, 0.75], col: 0xff8c00 },
                { pos: [0.75, 0.25, 0.75], col: 0xff8c00 },

                { pos: [0, 0, 1], col: 0xdc143c },
                { pos: [1, 0, 1], col: 0xdc143c },
                { pos: [0, 1, 1], col: 0xdc143c },
                { pos: [1, 1, 1], col: 0xdc143c },
                { pos: [0.5, 0.5, 1], col: 0xdc143c },
            ];

            const sphereGeo = new THREE.SphereGeometry(0.06, 32, 32);
            atomsData.forEach((atom) => {
                const mat = new THREE.MeshStandardMaterial({ color: atom.col, roughness: 0.2, metalness: 0.1 });
                const sphere = new THREE.Mesh(sphereGeo, mat);
                sphere.position.set(...atom.pos);
                scene.add(sphere);
            });

            // 立方晶胞外框
            const boxGeo = new THREE.BoxGeometry(1, 1, 1);
            const edges = new THREE.EdgesGeometry(boxGeo);
            const lineMat = new THREE.LineBasicMaterial({ color: 0x888888, linewidth: 1.5 });
            const wireframe = new THREE.LineSegments(edges, lineMat);
            wireframe.position.set(0.5, 0.5, 0.5);
            scene.add(wireframe);

            // 分層半透明平面
            const layersZ = [0, 0.25, 0.5, 0.75, 1.0];
            const colorsZ = [0x8a2be2, 0x1e90ff, 0x32cd32, 0xff8c00, 0xdc143c];

            layersZ.forEach((zVal, index) => {
                const planeGeo = new THREE.PlaneGeometry(1.1, 1.1);
                const planeMat = new THREE.MeshBasicMaterial({
                    color: colorsZ[index],
                    side: THREE.DoubleSide,
                    transparent: true,
                    opacity: 0.12,
                });
                const plane = new THREE.Mesh(planeGeo, planeMat);
                plane.position.set(0.5, 0.5, zVal);
                scene.add(plane);
            });

            // 正四面體鍵結線
            const bonds = [
                [
                    [0.25, 0.25, 0.25],
                    [0, 0, 0],
                ],
                [
                    [0.25, 0.25, 0.25],
                    [0.5, 0.5, 0],
                ],
                [
                    [0.25, 0.25, 0.25],
                    [0.5, 0, 0.5],
                ],
                [
                    [0.25, 0.25, 0.25],
                    [0, 0.5, 0.5],
                ],

                [
                    [0.75, 0.75, 0.25],
                    [1, 1, 0],
                ],
                [
                    [0.75, 0.75, 0.25],
                    [0.5, 0.5, 0],
                ],
                [
                    [0.75, 0.75, 0.25],
                    [1, 0.5, 0.5],
                ],
                [
                    [0.75, 0.75, 0.25],
                    [0.5, 1, 0.5],
                ],

                [
                    [0.25, 0.75, 0.75],
                    [0, 1, 1],
                ],
                [
                    [0.25, 0.75, 0.75],
                    [0.5, 0.5, 1],
                ],
                [
                    [0.25, 0.75, 0.75],
                    [0, 0.5, 0.5],
                ],
                [
                    [0.25, 0.75, 0.75],
                    [0.5, 1, 0.5],
                ],

                [
                    [0.75, 0.25, 0.75],
                    [1, 0, 1],
                ],
                [
                    [0.75, 0.25, 0.75],
                    [0.5, 0.5, 1],
                ],
                [
                    [0.75, 0.25, 0.75],
                    [1, 0.5, 0.5],
                ],
                [
                    [0.75, 0.25, 0.75],
                    [0.5, 0, 0.5],
                ],
            ];

            const bondMat = new THREE.LineBasicMaterial({ color: 0xaaaaaa, linewidth: 2 });
            bonds.forEach((bond) => {
                const points = [new THREE.Vector3(...bond[0]), new THREE.Vector3(...bond[1])];
                const bondGeo = new THREE.BufferGeometry().setFromPoints(points);
                const line = new THREE.Line(bondGeo, bondMat);
                scene.add(line);
            });

            function animate() {
                requestAnimationFrame(animate);
                controls.update();
                renderer.render(scene, camera);
            }
            animate();

            window.addEventListener("resize", () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });
        </script>
    </body>
</html>
